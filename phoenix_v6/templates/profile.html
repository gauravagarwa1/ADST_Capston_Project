{% extends "layout.html" %}{% block title %}Portfolio · Project Phoenix{% endblock %}{% block content %}<div id="profile"></div><div class="section-head"><div><div class="section-kicker">SHOW WHAT YOU CAN DO</div><h2>Showcased work</h2></div><button class="outline-btn">Sharing settings</button></div><div class="portfolio-grid" id="projects"></div>{% endblock %}{% block scripts %}<script>fetch('/api/profile').then(r=>r.json()).then(d=>{let s=d.student;profile.innerHTML=`<section class="portfolio-hero"><div class="avatar large">${s.student_name[0]}</div><div><div class="section-kicker">STUDENT PORTFOLIO</div><h1>${s.student_name}</h1><p>${s.education_level} · ${s.city}</p><span class="private-pill">PRIVATE · ONLY YOU & YOUR TEACHERS</span></div><div class="portfolio-stats"><b>${d.projects.length}</b><small>REVIEWED PROJECTS</small><b>${d.projects.reduce((a,x)=>a+x.points_earned,0)}</b><small>POINTS</small><b>6</b><small>BADGES</small></div></section>`;projects.innerHTML=d.projects.slice(0,6).map(x=>`<article class="portfolio-card"><span>${x.project_subject}</span><h3>${x.project_id}</h3><p>${x.ai_feedback}</p><strong>FINAL ${x.project_score} / 100</strong><small>Teacher-reviewed · Included in showcase</small><a href="#">Read project story →</a></article>`).join('')});</script>{% endblock %}
